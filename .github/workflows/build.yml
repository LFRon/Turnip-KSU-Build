      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     gh release view github_run >/dev/null 2>&1 || gh release create github_run
      #     gh release upload github_run out/turnip.zip \
      #         out/turnip_adrenotools.zip out/update.json changelog.md --clobber
